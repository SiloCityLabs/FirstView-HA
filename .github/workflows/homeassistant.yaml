name: Home Assistant

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly on Thursday at 11:00 UTC (6 AM EST / 7 AM EDT)
    - cron: '0 11 * * 4'

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
